services:
  db:
    image: pgvector/pgvector:pg16
    container_name: negotiation-tools-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-negotiation_tools}
      POSTGRES_USER: ${POSTGRES_USER:-negotiation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-negotiation_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-negotiation} -d ${POSTGRES_DB:-negotiation_tools}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: negotiation-tools-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://negotiation:negotiation_dev_password@db:5432/negotiation_tools}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://frontend:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: negotiation-tools-frontend
    command: npm run dev:docker
    restart: unless-stopped
    environment:
      SERVER_API_URL: ${SERVER_API_URL:-http://backend:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
